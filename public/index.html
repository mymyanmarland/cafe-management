<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brew &amp; Bean — Cafe Management</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --amber: #f5b453; --amber2: #e8893b; --cream: #fff8ec;
    --ink: #2b1d12; --muted: rgba(43,29,18,.62);
  }
  body {
    font-family: "Pyidaungsu", "Myanmar3", "Noto Sans Myanmar", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; color: var(--cream);
    background:
      radial-gradient(1200px 800px at 15% 10%, #6b3f1d 0%, transparent 60%),
      radial-gradient(1000px 700px at 85% 20%, #a05c2c 0%, transparent 55%),
      radial-gradient(900px 900px at 50% 100%, #3d2412 0%, transparent 60%),
      linear-gradient(160deg, #1c1008 0%, #2b1a0e 50%, #1c1008 100%);
    background-attachment: fixed;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .glass {
    background: rgba(255, 248, 236, 0.10);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255, 248, 236, 0.22);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
  }
  /* ---------- login ---------- */
  #loginView { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 380px; max-width: 100%; padding: 40px 34px; text-align: center; }
  .logo { font-size: 52px; }
  .login-card h1 { font-size: 26px; margin: 8px 0 2px; letter-spacing: .5px; }
  .login-card p.sub { color: rgba(255,248,236,.65); font-size: 13px; margin-bottom: 26px; }
  .field { margin-bottom: 14px; text-align: left; }
  .field label { display: block; font-size: 12px; margin-bottom: 6px; color: rgba(255,248,236,.75); }
  input, select, textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px; font-size: 15px;
    font-family: inherit; color: var(--cream);
    background: rgba(0,0,0,.28); border: 1px solid rgba(255,248,236,.22); outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,180,83,.25); }
  select option { color: #222; }
  .btn {
    display: inline-block; border: none; cursor: pointer; font-family: inherit;
    padding: 12px 22px; border-radius: 14px; font-size: 15px; font-weight: 700;
    background: linear-gradient(135deg, var(--amber), var(--amber2)); color: #2b1a0c;
    box-shadow: 0 6px 18px rgba(232,137,59,.4); transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(232,137,59,.5); }
  .btn:active { transform: translateY(0); }
  .btn.ghost { background: rgba(255,248,236,.12); color: var(--cream); box-shadow: none; border: 1px solid rgba(255,248,236,.25); }
  .btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn.danger { background: linear-gradient(135deg, #ff7a7a, #d63c3c); color: #fff; box-shadow: 0 6px 18px rgba(214,60,60,.4); }
  .btn.full { width: 100%; margin-top: 6px; }
  .err { color: #ffb3b3; font-size: 13px; min-height: 18px; margin: 8px 0; }
  .hint { margin-top: 16px; font-size: 12px; color: rgba(255,248,236,.5); }
  /* ---------- app shell ---------- */
  #appView { max-width: 1280px; margin: 0 auto; padding: 18px 18px 60px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 12px 18px; margin-bottom: 20px; position: sticky; top: 12px; z-index: 50; }
  .nav .brand { font-weight: 800; font-size: 18px; margin-right: 8px; white-space: nowrap; }
  .tabs { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  .tab { border: none; background: transparent; color: rgba(255,248,236,.7); font-family: inherit;
    font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 12px; cursor: pointer; }
  .tab.active { background: rgba(245,180,83,.22); color: #ffd9a0; box-shadow: inset 0 0 0 1px rgba(245,180,83,.4); }
  .lang-toggle { display: flex; background: rgba(0,0,0,.3); border-radius: 12px; padding: 3px; border: 1px solid rgba(255,248,236,.2); }
  .lang-toggle button { border: none; background: transparent; color: rgba(255,248,236,.6); font-family: inherit;
    font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 9px; cursor: pointer; }
  .lang-toggle button.active { background: linear-gradient(135deg, var(--amber), var(--amber2)); color: #2b1a0c; }
  .user-chip { font-size: 13px; color: rgba(255,248,236,.8); background: rgba(0,0,0,.28);
    padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,248,236,.18); white-space: nowrap; }
  .user-chip b { color: #ffd9a0; }
  section.tabpage { display: none; }
  section.tabpage.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none;} }
  /* ---------- dashboard ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat { padding: 22px; }
  .stat .k { font-size: 13px; color: rgba(255,248,236,.65); margin-bottom: 6px; }
  .stat .v { font-size: 30px; font-weight: 800; color: #ffd9a0; }
  .panel { padding: 22px; margin-bottom: 18px; }
  .panel h3 { font-size: 17px; margin-bottom: 14px; }
  .topitem { display: flex; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid rgba(255,248,236,.1); font-size: 14px; }
  .topitem:last-child { border-bottom: none; }
  .topitem .r { color: #ffd9a0; font-weight: 700; }
  /* ---------- POS ---------- */
  .pos-wrap { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .pos-wrap { grid-template-columns: 1fr; } }
  .cat-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .cat { border: 1px solid rgba(255,248,236,.22); background: rgba(0,0,0,.25); color: rgba(255,248,236,.75);
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .cat.active { background: linear-gradient(135deg, var(--amber), var(--amber2)); color: #2b1a0c; border-color: transparent; }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .mi { padding: 16px; cursor: pointer; transition: transform .12s; }
  .mi:hover { transform: translateY(-3px); background: rgba(255,248,236,.16); }
  .mi .nm { font-weight: 700; font-size: 14px; }
  .mi .nm_my { font-size: 12px; color: rgba(255,248,236,.6); margin-top: 2px; }
  .mi .pr { color: #ffd9a0; font-weight: 800; margin-top: 8px; font-size: 15px; }
  .mi .ds { font-size: 11px; color: rgba(255,248,236,.5); margin-top: 4px; }
  .cart { padding: 20px; position: sticky; top: 90px; }
  .cart h3 { margin-bottom: 12px; }
  .cline { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,248,236,.1); font-size: 13px; }
  .cline .n { flex: 1; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button { width: 24px; height: 24px; border-radius: 8px; border: 1px solid rgba(255,248,236,.3);
    background: rgba(0,0,0,.3); color: var(--cream); cursor: pointer; font-size: 14px; line-height: 1; }
  .ctotal { display: flex; justify-content: space-between; font-weight: 800; font-size: 17px; margin: 14px 0; color: #ffd9a0; }
  .cart-empty { text-align: center; color: rgba(255,248,236,.45); padding: 24px 0; font-size: 14px; }
  /* ---------- orders list ---------- */
  .order { padding: 16px 18px; margin-bottom: 12px; }
  .order .hd { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .order .id { font-weight: 800; font-size: 15px; }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .b-pending { background: rgba(245,180,83,.25); color: #ffd9a0; }
  .b-preparing { background: rgba(96,165,250,.25); color: #bcd6ff; }
  .b-served { background: rgba(52,211,153,.22); color: #a7f3d0; }
  .b-completed { background: rgba(148,163,184,.25); color: #cbd5e1; }
  .b-cancelled { background: rgba(248,113,113,.25); color: #fecaca; }
  .order .items { font-size: 13px; color: rgba(255,248,236,.7); margin-bottom: 10px; }
  .order .meta { font-size: 12px; color: rgba(255,248,236,.5); margin-bottom: 10px; }
  .order .ft { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .order .ft .tot { margin-left: auto; font-weight: 800; color: #ffd9a0; }
  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(255,248,236,.1); }
  th { color: rgba(255,248,236,.6); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .rowbtns { display: flex; gap: 6px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input { max-width: 280px; }
  /* ---------- modal ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(10,5,2,.6); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
  .modal-bg.open { display: flex; }
  .modal { width: 440px; max-width: 100%; padding: 28px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 18px; }
  .mrow { display: flex; gap: 10px; margin-top: 16px; }
  .mrow .btn { flex: 1; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 10px 0; }
  .chk input { width: auto; }
  .seg { display: flex; gap: 8px; margin-bottom: 6px; }
  .seg button { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,248,236,.25);
    background: rgba(0,0,0,.25); color: rgba(255,248,236,.7); font-family: inherit; font-weight: 700; cursor: pointer; }
  .seg button.active { background: linear-gradient(135deg, var(--amber), var(--amber2)); color: #2b1a0c; border-color: transparent; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: rgba(20,12,6,.85); border: 1px solid rgba(245,180,83,.5); color: #ffd9a0;
    padding: 12px 22px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 200;
    transition: transform .25s; backdrop-filter: blur(10px); }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView">
  <div class="glass login-card">
    <div class="logo">☕</div>
    <h1>Brew &amp; Bean</h1>
    <p class="sub" data-i18n="tagline">Cafe Management System</p>
    <div class="field">
      <label data-i18n="username">Username</label>
      <input id="liUser" autocomplete="username" placeholder="admin">
    </div>
    <div class="field">
      <label data-i18n="password">Password</label>
      <input id="liPass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="err" id="liErr"></div>
    <button class="btn full" id="liBtn" data-i18n="signIn">Sign in</button>
    <div class="lang-toggle" style="margin: 18px auto 0; width: max-content;">
      <button id="langMy">မြန်မာ</button>
      <button id="langEn">English</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appView" hidden>
  <nav class="glass nav">
    <div class="brand">☕ Brew &amp; Bean</div>
    <div class="tabs">
      <button class="tab active" data-tab="dashboard" data-i18n="dashboard">Dashboard</button>
      <button class="tab" data-tab="pos" data-i18n="pos">POS</button>
      <button class="tab" data-tab="orders" data-i18n="orders">Orders</button>
      <button class="tab" data-tab="menu" data-i18n="menu">Menu</button>
      <button class="tab" data-tab="users" data-i18n="users" id="usersTab" hidden>Users</button>
    </div>
    <div class="lang-toggle">
      <button id="langMy2">မြန်မာ</button>
      <button id="langEn2">English</button>
    </div>
    <div class="user-chip"><b id="chipUser">–</b> · <span id="chipRole">–</span></div>
    <button class="btn small ghost" id="logoutBtn" data-i18n="logout">Logout</button>
  </nav>

  <!-- DASHBOARD -->
  <section class="tabpage active" id="page-dashboard">
    <div class="stats">
      <div class="glass stat"><div class="k" data-i18n="todayRevenue">Today's Revenue</div><div class="v" id="stRevenue">–</div></div>
      <div class="glass stat"><div class="k" data-i18n="todayOrders">Today's Orders</div><div class="v" id="stOrders">–</div></div>
      <div class="glass stat"><div class="k" data-i18n="activeOrders">Active Orders</div><div class="v" id="stActive">–</div></div>
    </div>
    <div class="glass panel">
      <h3 data-i18n="topItems">Top Selling Items</h3>
      <div id="topList"></div>
    </div>
  </section>

  <!-- POS -->
  <section class="tabpage" id="page-pos">
    <div class="pos-wrap">
      <div>
        <div class="toolbar">
          <input id="posSearch" data-i18n-ph="search" placeholder="Search menu...">
        </div>
        <div class="cat-row" id="catRow"></div>
        <div class="menu-grid" id="posGrid"></div>
      </div>
      <div class="glass cart">
        <h3 data-i18n="cart">Cart</h3>
        <div id="cartLines"></div>
        <div class="ctotal"><span data-i18n="total">Total</span><span id="cartTotal">0 Ks</span></div>
        <button class="btn full" id="checkoutBtn" data-i18n="checkout">Checkout</button>
      </div>
    </div>
  </section>

  <!-- ORDERS -->
  <section class="tabpage" id="page-orders">
    <div id="orderList"></div>
  </section>

  <!-- MENU -->
  <section class="tabpage" id="page-menu">
    <div class="glass panel">
      <div class="toolbar">
        <button class="btn small" id="addMenuBtn" data-i18n="addItem">+ Add Item</button>
        <input id="menuSearch" data-i18n-ph="search" placeholder="Search menu...">
      </div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th data-i18n="itemName">Name (EN)</th><th data-i18n="itemNameMy">Name (မြန်မာ)</th>
          <th data-i18n="category">Category</th><th data-i18n="price">Price (Ks)</th>
          <th data-i18n="available">Available</th><th data-i18n="actions">Actions</th>
        </tr></thead>
        <tbody id="menuRows"></tbody>
      </table>
      </div>
    </div>
  </section>

  <!-- USERS -->
  <section class="tabpage" id="page-users">
    <div class="glass panel">
      <div class="toolbar">
        <button class="btn small" id="addUserBtn" data-i18n="addUser">+ Add User</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th data-i18n="username">Username</th><th data-i18n="role">Role</th><th data-i18n="actions">Actions</th></tr></thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>
  </section>
</div>

<!-- ============ CHECKOUT MODAL ============ -->
<div class="modal-bg" id="checkoutModal">
  <div class="glass modal">
    <h3 data-i18n="checkout">Checkout</h3>
    <div class="field">
      <label data-i18n="orderType">Order type</label>
      <div class="seg">
        <button id="segDine" class="active" data-i18n="dineIn">Dine-in</button>
        <button id="segTake" data-i18n="takeaway">Takeaway</button>
      </div>
    </div>
    <div class="field" id="tableField">
      <label data-i18n="tableNo">Table no.</label>
      <input id="coTable" placeholder="A1">
    </div>
    <div class="field">
      <label data-i18n="customerName">Customer name</label>
      <input id="coName" placeholder="—">
    </div>
    <div class="field">
      <label data-i18n="phone">Phone (09...)</label>
      <input id="coPhone" inputmode="tel" placeholder="09123456789">
    </div>
    <div class="err" id="coErr"></div>
    <div class="ctotal"><span data-i18n="total">Total</span><span id="coTotal">0 Ks</span></div>
    <div class="mrow">
      <button class="btn ghost" id="coCancel" data-i18n="cancel">Cancel</button>
      <button class="btn" id="coPlace" data-i18n="placeOrder">Place Order</button>
    </div>
  </div>
</div>

<!-- ============ MENU ITEM MODAL ============ -->
<div class="modal-bg" id="menuModal">
  <div class="glass modal">
    <h3 id="menuModalTitle">Item</h3>
    <input type="hidden" id="miId">
    <div class="field"><label data-i18n="itemName">Name (EN)</label><input id="miName"></div>
    <div class="field"><label data-i18n="itemNameMy">Name (မြန်မာ)</label><input id="miNameMy"></div>
    <div class="field"><label data-i18n="category">Category</label>
      <select id="miCat"><option>Coffee</option><option>Tea &amp; Drinks</option><option>Food</option></select>
    </div>
    <div class="field"><label data-i18n="price">Price (Ks)</label><input id="miPrice" type="number" min="0" step="100"></div>
    <div class="field"><label data-i18n="description">Description</label><input id="miDesc"></div>
    <label class="chk"><input type="checkbox" id="miAvail" checked> <span data-i18n="available">Available</span></label>
    <div class="err" id="miErr"></div>
    <div class="mrow">
      <button class="btn ghost" id="miCancel" data-i18n="cancel">Cancel</button>
      <button class="btn" id="miSave" data-i18n="save">Save</button>
    </div>
  </div>
</div>

<!-- ============ USER MODAL ============ -->
<div class="modal-bg" id="userModal">
  <div class="glass modal">
    <h3 id="userModalTitle">User</h3>
    <div class="field"><label data-i18n="username">Username</label><input id="uName"></div>
    <div class="field"><label data-i18n="newPassword">New password</label><input id="uPass" type="password"></div>
    <div class="field"><label data-i18n="role">Role</label>
      <select id="uRole"><option value="staff">Staff</option><option value="admin">Admin</option></select>
    </div>
    <div class="err" id="uErr"></div>
    <div class="mrow">
      <button class="btn ghost" id="uCancel" data-i18n="cancel">Cancel</button>
      <button class="btn" id="uSave" data-i18n="save">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= i18n ================= */
const I18N = {
en: {
  tagline: "Cafe Management System", signIn: "Sign in", username: "Username", password: "Password",
  dashboard: "Dashboard", pos: "POS", orders: "Orders", menu: "Menu", users: "Users", logout: "Logout",
  todayRevenue: "Today's Revenue", todayOrders: "Today's Orders", activeOrders: "Active Orders",
  topItems: "Top Selling Items", cart: "Cart", checkout: "Checkout", total: "Total",
  customerName: "Customer name", phone: "Phone (09...)", tableNo: "Table no.",
  orderType: "Order type", dineIn: "Dine-in", takeaway: "Takeaway",
  placeOrder: "Place Order", cancel: "Cancel", save: "Save",
  itemName: "Name (EN)", itemNameMy: "Name (Myanmar)", category: "Category",
  price: "Price (Ks)", description: "Description", available: "Available", actions: "Actions",
  addItem: "+ Add Item", addUser: "+ Add User", role: "Role", newPassword: "New password",
  edit: "Edit", del: "Delete", resetPw: "Reset PW",
  pending: "Pending", preparing: "Preparing", served: "Served", completed: "Completed", cancelled: "Cancelled",
  sold: "sold", search: "Search menu...", emptyCart: "Cart is empty — tap a menu item to add it.",
  orderPlaced: "Order placed! 🎉", phoneInvalid: "Please enter a valid Myanmar phone (e.g. 09123456789)",
  confirmDelete: "Delete this? This cannot be undone.", deleted: "Deleted.", saved: "Saved.",
  admin: "Admin", staff: "Staff", all: "All",
  catCoffee: "Coffee", catTea: "Tea & Drinks", catFood: "Food",
},
my: {
  tagline: "ကော်ဖီဆိုင် စီမံခန့်ခွဲမှုစနစ်", signIn: "ဝင်ရန်", username: "အသုံးပြုသူအမည်", password: "စကားဝှက်",
  dashboard: "ဒက်ရှ်ဘုတ်", pos: "ရောင်းချမှု", orders: "အမှာစာများ", menu: "မီနူး", users: "အသုံးပြုသူများ", logout: "ထွက်ရန်",
  todayRevenue: "ယနေ့ဝင်ငွေ", todayOrders: "ယနေ့အမှာစာ", activeOrders: "လုပ်ဆောင်ဆဲ",
  topItems: "အရောင်းရဆုံးများ", cart: "ခြင်းတောင်း", checkout: "ငွေရှင်းရန်", total: "စုစုပေါင်း",
  customerName: "ဝယ်သူအမည်", phone: "ဖုန်း (09...)", tableNo: "စားပွဲအမှတ်",
  orderType: "အမှာစာအမျိုးအစား", dineIn: "ဆိုင်မှာစား", takeaway: "ပါဆယ်",
  placeOrder: "အမှာစာတင်ရန်", cancel: "မလုပ်တော့ပါ", save: "သိမ်းရန်",
  itemName: "အမည် (EN)", itemNameMy: "အမည် (မြန်မာ)", category: "အမျိုးအစား",
  price: "ဈေးနှုန်း (ကျပ်)", description: "ဖော်ပြချက်", available: "ရရှိနိုင်", actions: "လုပ်ဆောင်ချက်",
  addItem: "+ ပစ္စည်းထည့်ရန်", addUser: "+ အသုံးပြုသူထည့်ရန်", role: "အခန်းကဏ္ဍ", newPassword: "စကားဝှက်အသစ်",
  edit: "ပြင်ရန်", del: "ဖျက်ရန်", resetPw: "PW ချိန်းရန်",
  pending: "စောင့်ဆိုင်း", preparing: "ပြင်ဆင်နေ", served: "ချပေး", completed: "ပြီးဆုံး", cancelled: "ပယ်ဖျက်",
  sold: "ခုရောင်းရ", search: "မီနူးရှာရန်...", emptyCart: "ခြင်းတောင်းဗလာနေပါတယ် — မီနူးကိုနှိပ်ပြီးထည့်ပါ။",
  orderPlaced: "အမှာစာတင်ပြီးပါပြီ! 🎉", phoneInvalid: "မှန်ကန်သောမြန်မာဖုန်းနံပါတ်ထည့်ပါ (ဥပမာ 09123456789)",
  confirmDelete: "ဖျက်မှာသေချာလား? ပြန်မရနိုင်ပါ။", deleted: "ဖျက်ပြီးပါပြီ။", saved: "သိမ်းပြီးပါပြီ။",
  admin: "အက်ဒမင်", staff: "ဝန်ထမ်း", all: "အားလုံး",
  catCoffee: "ကော်ဖီ", catTea: "လက်ဖက်ရည် နှင့် အဖျော်ယမကာ", catFood: "အစားအစာ",
}};
let lang = localStorage.getItem("bb_lang") || "my";
const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;
const CAT_I18N = { "Coffee": "catCoffee", "Tea & Drinks": "catTea", "Food": "catFood" };
const catName = (c) => t(CAT_I18N[c] || c);
const fmt = (n) => Number(n || 0).toLocaleString("en-US") + " Ks";
const itemName = (m) => lang === "my" && m.name_my ? m.name_my : m.name;

function applyLang() {
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.documentElement.lang = lang;
  for (const id of ["langMy", "langMy2"]) document.getElementById(id)?.classList.toggle("active", lang === "my");
  for (const id of ["langEn", "langEn2"]) document.getElementById(id)?.classList.toggle("active", lang === "en");
  renderAll();
}
function setLang(l) { lang = l; localStorage.setItem("bb_lang", l); applyLang(); }
["langMy", "langMy2"].forEach((id) => document.getElementById(id)?.addEventListener("click", () => setLang("my")));
["langEn", "langEn2"].forEach((id) => document.getElementById(id)?.addEventListener("click", () => setLang("en")));

/* ================= state & api ================= */
let me = null, menu = [], orders = [], users = [], stats = null;
let cart = {}, activeCat = "All", orderType = "dine-in";
const token = () => localStorage.getItem("bb_token");
async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(token() ? { Authorization: "Bearer " + token() } : {}), ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { doLogout(); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ================= auth ================= */
async function doLogin() {
  const u = document.getElementById("liUser").value.trim();
  const p = document.getElementById("liPass").value;
  const err = document.getElementById("liErr");
  err.textContent = "";
  try {
    const d = await api("/api/auth/login", { method: "POST", body: { username: u, password: p } });
    localStorage.setItem("bb_token", d.token);
    me = d.user;
    enterApp();
  } catch (e) { err.textContent = e.message; }
}
function doLogout() {
  if (token()) api("/api/auth/logout", { method: "POST" }).catch(() => {});
  localStorage.removeItem("bb_token");
  me = null;
  document.getElementById("appView").hidden = true;
  document.getElementById("loginView").style.display = "flex";
}
function enterApp() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("appView").hidden = false;
  document.getElementById("chipUser").textContent = me.username;
  document.getElementById("chipRole").textContent = t(me.role);
  document.getElementById("usersTab").hidden = me.role !== "admin";
  document.getElementById("addMenuBtn").style.display = me.role === "admin" ? "" : "none";
  refreshAll();
}
document.getElementById("liBtn").addEventListener("click", doLogin);
document.getElementById("liPass").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
document.getElementById("logoutBtn").addEventListener("click", doLogout);

/* ================= tabs ================= */
document.querySelectorAll(".tab").forEach((b) =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    document.querySelectorAll(".tabpage").forEach((p) => p.classList.remove("active"));
    document.getElementById("page-" + b.dataset.tab).classList.add("active");
  })
);

/* ================= data ================= */
async function refreshAll() {
  try {
    [menu, orders, stats] = await Promise.all([
      api("/api/menu"), api("/api/orders"), api("/api/stats"),
    ]);
    if (me.role === "admin") users = await api("/api/users");
    renderAll();
  } catch (e) { /* logged out */ }
}
function renderAll() {
  if (!me) return;
  renderStats(); renderCats(); renderPos(); renderCart(); renderOrders(); renderMenuTable(); renderUsers();
}
function renderStats() {
  if (!stats) return;
  document.getElementById("stRevenue").textContent = fmt(stats.revenue);
  document.getElementById("stOrders").textContent = stats.orders;
  document.getElementById("stActive").textContent = stats.active;
  document.getElementById("topList").innerHTML = (stats.top || []).map((x) =>
    `<div class="topitem"><span>${x.name} <small style="opacity:.6">· ${x.sold} ${t("sold")}</small></span><span class="r">${fmt(x.revenue)}</span></div>`
  ).join("") || `<div class="cart-empty">–</div>`;
}

/* ================= POS ================= */
function renderCats() {
  const cats = ["All", ...new Set(menu.map((m) => m.category))];
  document.getElementById("catRow").innerHTML = cats.map((c) =>
    `<button class="cat${c === activeCat ? " active" : ""}" data-c="${c}">${c === "All" ? t("all") : catName(c)}</button>`
  ).join("");
  document.querySelectorAll(".cat").forEach((b) =>
    b.addEventListener("click", () => { activeCat = b.dataset.c; renderCats(); renderPos(); })
  );
}
function renderPos() {
  const q = (document.getElementById("posSearch").value || "").toLowerCase();
  const list = menu.filter((m) =>
    (activeCat === "All" || m.category === activeCat) &&
    (!q || m.name.toLowerCase().includes(q) || (m.name_my || "").includes(q))
  );
  document.getElementById("posGrid").innerHTML = list.map((m) => `
    <div class="glass mi" data-id="${m.id}">
      <div class="nm">${m.name}</div>
      ${m.name_my ? `<div class="nm_my">${m.name_my}</div>` : ""}
      <div class="pr">${fmt(m.price)}</div>
      ${m.description ? `<div class="ds">${m.description}</div>` : ""}
    </div>`).join("");
  document.querySelectorAll(".mi").forEach((el) =>
    el.addEventListener("click", () => {
      const id = Number(el.dataset.id);
      cart[id] = (cart[id] || 0) + 1;
      renderCart();
    })
  );
}
document.getElementById("posSearch").addEventListener("input", renderPos);
function cartTotal() {
  return Object.entries(cart).reduce((s, [id, q]) => {
    const m = menu.find((x) => x.id === Number(id));
    return s + (m ? m.price * q : 0);
  }, 0);
}
function renderCart() {
  const box = document.getElementById("cartLines");
  const ids = Object.keys(cart);
  if (!ids.length) { box.innerHTML = `<div class="cart-empty">${t("emptyCart")}</div>`; }
  else {
    box.innerHTML = ids.map((id) => {
      const m = menu.find((x) => x.id === Number(id));
      if (!m) return "";
      return `<div class="cline">
        <div class="n">${itemName(m)}<br><small style="opacity:.6">${fmt(m.price)}</small></div>
        <div class="qty">
          <button data-a="dec" data-id="${id}">−</button><span>${cart[id]}</span><button data-a="inc" data-id="${id}">+</button>
        </div>
        <div style="min-width:70px;text-align:right;font-weight:700">${fmt(m.price * cart[id])}</div>
      </div>`;
    }).join("");
    box.querySelectorAll("button").forEach((b) =>
      b.addEventListener("click", () => {
        const id = b.dataset.id;
        if (b.dataset.a === "inc") cart[id]++;
        else { cart[id]--; if (cart[id] <= 0) delete cart[id]; }
        renderCart();
      })
    );
  }
  document.getElementById("cartTotal").textContent = fmt(cartTotal());
}

/* ================= checkout ================= */
const cModal = document.getElementById("checkoutModal");
function openModal(m) { m.classList.add("open"); }
function closeModal(m) { m.classList.remove("open"); }
document.getElementById("checkoutBtn").addEventListener("click", () => {
  if (!Object.keys(cart).length) return toast(t("emptyCart"));
  document.getElementById("coErr").textContent = "";
  document.getElementById("coTotal").textContent = fmt(cartTotal());
  openModal(cModal);
});
document.getElementById("coCancel").addEventListener("click", () => closeModal(cModal));
function setOrderType(v) {
  orderType = v;
  document.getElementById("segDine").classList.toggle("active", v === "dine-in");
  document.getElementById("segTake").classList.toggle("active", v === "takeaway");
  document.getElementById("tableField").style.display = v === "dine-in" ? "" : "none";
}
document.getElementById("segDine").addEventListener("click", () => setOrderType("dine-in"));
document.getElementById("segTake").addEventListener("click", () => setOrderType("takeaway"));
document.getElementById("coPlace").addEventListener("click", async () => {
  const phone = document.getElementById("coPhone").value.trim();
  const err = document.getElementById("coErr");
  if (phone && !/^09\d{7,9}$/.test(phone)) { err.textContent = t("phoneInvalid"); return; }
  try {
    await api("/api/orders", { method: "POST", body: {
      table_no: orderType === "dine-in" ? document.getElementById("coTable").value.trim() : "",
      order_type: orderType,
      customer_name: document.getElementById("coName").value.trim(),
      customer_phone: phone,
      items: Object.entries(cart).map(([menu_id, qty]) => ({ menu_id: Number(menu_id), qty })),
    }});
    cart = {};
    document.getElementById("coName").value = "";
    document.getElementById("coPhone").value = "";
    document.getElementById("coTable").value = "";
    closeModal(cModal);
    toast(t("orderPlaced"));
    refreshAll();
  } catch (e) { err.textContent = e.message; }
});

/* ================= orders ================= */
const STATUS_FLOW = ["pending", "preparing", "served", "completed"];
function renderOrders() {
  const box = document.getElementById("orderList");
  box.innerHTML = orders.map((o) => {
    const next = STATUS_FLOW[STATUS_FLOW.indexOf(o.status) + 1];
    return `<div class="glass order">
      <div class="hd">
        <span class="id">#${o.id} ${o.table_no ? "· 🪑 " + o.table_no : ""} ${o.order_type === "takeaway" ? "· 🛍️ " + t("takeaway") : ""}</span>
        <span class="badge b-${o.status}">${t(o.status)}</span>
      </div>
      <div class="items">${o.items.map((i) => `${i.name} × ${i.qty}`).join(" · ")}</div>
      <div class="meta">${new Date(o.created_at).toLocaleString(lang === "my" ? "my-MM" : "en-US")}
        ${o.customer_name ? " · 👤 " + o.customer_name : ""}${o.customer_phone ? " · 📞 " + o.customer_phone : ""}</div>
      <div class="ft">
        ${next ? `<button class="btn small" data-s="${next}" data-id="${o.id}">→ ${t(next)}</button>` : ""}
        ${o.status !== "cancelled" && o.status !== "completed" ? `<button class="btn small ghost" data-s="cancelled" data-id="${o.id}">${t("cancelled")}</button>` : ""}
        ${me.role === "admin" ? `<button class="btn small danger" data-del="${o.id}">${t("del")}</button>` : ""}
        <span class="tot">${fmt(o.total)}</span>
      </div>
    </div>`;
  }).join("") || `<div class="glass panel">${t("emptyCart")}</div>`;
  box.querySelectorAll("[data-s]").forEach((b) =>
    b.addEventListener("click", async () => {
      try { await api(`/api/orders/${b.dataset.id}/status`, { method: "PUT", body: { status: b.dataset.s } }); refreshAll(); }
      catch (e) { toast(e.message); }
    })
  );
  box.querySelectorAll("[data-del]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm(t("confirmDelete"))) return;
      try { await api(`/api/orders/${b.dataset.del}`, { method: "DELETE" }); toast(t("deleted")); refreshAll(); }
      catch (e) { toast(e.message); }
    })
  );
}

/* ================= menu mgmt (admin) ================= */
const mModal = document.getElementById("menuModal");
let editingMenuId = null;
function renderMenuTable() {
  const q = (document.getElementById("menuSearch").value || "").toLowerCase();
  const isAdmin = me.role === "admin";
  document.getElementById("menuRows").innerHTML = menu
    .filter((m) => !q || m.name.toLowerCase().includes(q) || (m.name_my || "").includes(q))
    .map((m) => `<tr>
      <td>${m.name}</td><td>${m.name_my || "–"}</td><td>${catName(m.category)}</td>
      <td>${fmt(m.price)}</td><td>${m.available ? "✅" : "❌"}</td>
      <td>${isAdmin ? `<div class="rowbtns">
        <button class="btn small ghost" data-edit="${m.id}">${t("edit")}</button>
        <button class="btn small danger" data-mdel="${m.id}">${t("del")}</button>
      </div>` : "–"}</td>
    </tr>`).join("");
  document.querySelectorAll("[data-edit]").forEach((b) =>
    b.addEventListener("click", () => {
      const m = menu.find((x) => x.id === Number(b.dataset.edit));
      editingMenuId = m.id;
      document.getElementById("menuModalTitle").textContent = t("edit");
      document.getElementById("miName").value = m.name;
      document.getElementById("miNameMy").value = m.name_my || "";
      document.getElementById("miCat").value = m.category;
      document.getElementById("miPrice").value = m.price;
      document.getElementById("miDesc").value = m.description || "";
      document.getElementById("miAvail").checked = !!m.available;
      document.getElementById("miErr").textContent = "";
      openModal(mModal);
    })
  );
  document.querySelectorAll("[data-mdel]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm(t("confirmDelete"))) return;
      try { await api(`/api/menu/${b.dataset.mdel}`, { method: "DELETE" }); toast(t("deleted")); refreshAll(); }
      catch (e) { toast(e.message); }
    })
  );
}
document.getElementById("menuSearch").addEventListener("input", renderMenuTable);
document.getElementById("addMenuBtn").addEventListener("click", () => {
  editingMenuId = null;
  document.getElementById("menuModalTitle").textContent = t("addItem");
  for (const id of ["miName", "miNameMy", "miPrice", "miDesc"]) document.getElementById(id).value = "";
  document.getElementById("miAvail").checked = true;
  document.getElementById("miErr").textContent = "";
  openModal(mModal);
});
document.getElementById("miCancel").addEventListener("click", () => closeModal(mModal));
document.getElementById("miSave").addEventListener("click", async () => {
  const body = {
    name: document.getElementById("miName").value.trim(),
    name_my: document.getElementById("miNameMy").value.trim(),
    category: document.getElementById("miCat").value,
    price: Number(document.getElementById("miPrice").value),
    description: document.getElementById("miDesc").value.trim(),
    available: document.getElementById("miAvail").checked,
  };
  try {
    if (editingMenuId) await api(`/api/menu/${editingMenuId}`, { method: "PUT", body });
    else await api("/api/menu", { method: "POST", body });
    closeModal(mModal); toast(t("saved")); refreshAll();
  } catch (e) { document.getElementById("miErr").textContent = e.message; }
});

/* ================= users (admin) ================= */
const uModal = document.getElementById("userModal");
let pwUserId = null;
function renderUsers() {
  if (me.role !== "admin") return;
  document.getElementById("userRows").innerHTML = users.map((u) => `<tr>
    <td>${u.id}</td><td>${u.username}</td><td>${t(u.role)}</td>
    <td><div class="rowbtns">
      <button class="btn small ghost" data-role="${u.id}" data-r="${u.role === "admin" ? "staff" : "admin"}">
        ${u.role === "admin" ? "→ " + t("staff") : "→ " + t("admin")}</button>
      <button class="btn small ghost" data-pw="${u.id}">${t("resetPw")}</button>
      ${u.id !== me.id ? `<button class="btn small danger" data-udel="${u.id}">${t("del")}</button>` : ""}
    </div></td>
  </tr>`).join("");
  document.querySelectorAll("[data-role]").forEach((b) =>
    b.addEventListener("click", async () => {
      try { await api(`/api/users/${b.dataset.role}`, { method: "PUT", body: { role: b.dataset.r } }); toast(t("saved")); refreshAll(); }
      catch (e) { toast(e.message); }
    })
  );
  document.querySelectorAll("[data-pw]").forEach((b) =>
    b.addEventListener("click", () => {
      pwUserId = b.dataset.pw;
      document.getElementById("userModalTitle").textContent = t("resetPw");
      document.getElementById("uName").value = users.find((x) => x.id === Number(pwUserId)).username;
      document.getElementById("uName").disabled = true;
      document.getElementById("uPass").value = "";
      document.getElementById("uRole").value = users.find((x) => x.id === Number(pwUserId)).role;
      document.getElementById("uErr").textContent = "";
      openModal(uModal);
    })
  );
  document.querySelectorAll("[data-udel]").forEach((b) =>
    b.addEventListener("click", async () => {
      if (!confirm(t("confirmDelete"))) return;
      try { await api(`/api/users/${b.dataset.udel}`, { method: "DELETE" }); toast(t("deleted")); refreshAll(); }
      catch (e) { toast(e.message); }
    })
  );
}
document.getElementById("addUserBtn").addEventListener("click", () => {
  pwUserId = null;
  document.getElementById("userModalTitle").textContent = t("addUser");
  document.getElementById("uName").value = "";
  document.getElementById("uName").disabled = false;
  document.getElementById("uPass").value = "";
  document.getElementById("uRole").value = "staff";
  document.getElementById("uErr").textContent = "";
  openModal(uModal);
});
document.getElementById("uCancel").addEventListener("click", () => closeModal(uModal));
document.getElementById("uSave").addEventListener("click", async () => {
  const uname = document.getElementById("uName").value.trim();
  const pw = document.getElementById("uPass").value;
  const role = document.getElementById("uRole").value;
  try {
    if (pwUserId) await api(`/api/users/${pwUserId}`, { method: "PUT", body: { password: pw || undefined, role } });
    else await api("/api/users", { method: "POST", body: { username: uname, password: pw, role } });
    closeModal(uModal); toast(t("saved")); refreshAll();
  } catch (e) { document.getElementById("uErr").textContent = e.message; }
});

/* ================= boot ================= */
(async () => {
  applyLang();
  if (token()) {
    try { me = await api("/api/auth/me"); enterApp(); }
    catch (e) { doLogout(); }
  }
})();
</script>
</body>
</html>
